      <text x="190" y="168" text-anchor="middle" fill="#9ca3af" font-size="13">slip-on, lens/button/USB cut-outs</text>
      <text x="190" y="190" text-anchor="middle" fill="#6b7280" font-size="12">also: soft silicone skin</text>
