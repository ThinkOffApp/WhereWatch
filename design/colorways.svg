      <circle cx="190" cy="96" r="25" fill="#0a0a0a"/><circle cx="190" cy="96" r="16" fill="#1b1b1f"/><circle cx="183" cy="89" r="6" fill="#fff" opacity="0.4"/>
      <rect x="179" y="142" width="22" height="38" rx="11" fill="#000" opacity="0.18"/>
      <text x="190" y="238" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Yellow</text>
