<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <rect width="760" height="1040" fill="url(#bg)"/>
  <text x="40" y="56" fill="#d4a5e9" font-size="27" font-weight="700">WhereWatch pendant</text>
  <text x="40" y="86" fill="#9ca3af" font-size="15">Soft-touch shell: Black + four ThinkOff colors.</text>

  <!-- grid: 2 columns x rows; cell 380 wide, pendant centered at x=190 within cell -->
  <!-- helper via inlined groups -->
  <!-- Row1: Black, Fuchsia -->
  <g transform="translate(0,120)">
    <!-- Black -->
    <g transform="translate(0,0)">
      <line x1="190" y1="4" x2="190" y2="30" stroke="#555" stroke-width="4"/>
      <circle cx="190" cy="22" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M140 66 Q190 30 240 66 Q266 124 240 206 Q190 244 140 206 Q114 124 140 66 Z" fill="#1c1c1e"/>
      <path d="M140 66 Q190 30 240 66 Q266 124 240 206 Q190 244 140 206 Q114 124 140 66 Z" fill="url(#sheen)"/>
      <circle cx="190" cy="96" r="25" fill="#0a0a0a"/><circle cx="190" cy="96" r="16" fill="#1b1b1f"/><circle cx="183" cy="89" r="6" fill="#fff" opacity="0.4"/>
      <rect x="179" y="142" width="22" height="38" rx="11" fill="#000" opacity="0.35"/>
      <text x="190" y="238" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Black</text>
      <text x="190" y="258" text-anchor="middle" fill="#6b7280" font-size="12">#1C1C1E</text>
    </g>
    <!-- Fuchsia -->
    <g transform="translate(380,0)">
      <line x1="190" y1="4" x2="190" y2="30" stroke="#555" stroke-width="4"/>
      <circle cx="190" cy="22" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M140 66 Q190 30 240 66 Q266 124 240 206 Q190 244 140 206 Q114 124 140 66 Z" fill="#d946ef"/>
      <path d="M140 66 Q190 30 240 66 Q266 124 240 206 Q190 244 140 206 Q114 124 140 66 Z" fill="url(#sheen)"/>
      <circle cx="190" cy="96" r="25" fill="#0a0a0a"/><circle cx="190" cy="96" r="16" fill="#1b1b1f"/><circle cx="183" cy="89" r="6" fill="#fff" opacity="0.4"/>
      <rect x="179" y="142" width="22" height="38" rx="11" fill="#000" opacity="0.22"/>
      <text x="190" y="238" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Fuchsia</text>
      <text x="190" y="258" text-anchor="middle" fill="#6b7280" font-size="12">#D946EF</text>
