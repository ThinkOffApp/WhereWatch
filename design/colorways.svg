<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="560" fill="url(#bg)"/>
  <text x="40" y="52" fill="#d4a5e9" font-size="26" font-weight="700">WhereWatch pendant — colorways + covers</text>
  <text x="40" y="80" fill="#9ca3af" font-size="15">Soft-touch shell in Black + four ThinkOff colors. Optional slip-on covers: soft silicone or a furry plush.</text>

  <!-- pendant symbol reused via a group we redraw per color -->
  <!-- Row of 5 color shells -->
  <g transform="translate(0,110)">
    <!-- helper: each cell 200 wide -->
    <!-- Black -->
    <g transform="translate(70,0)">
      <line x1="90" y1="-6" x2="90" y2="22" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="14" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="#1c1c1e"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="88" r="25" fill="#0a0a0a"/><circle cx="90" cy="88" r="16" fill="#1b1b1f"/><circle cx="83" cy="81" r="6" fill="#fff" opacity="0.4"/>
      <rect x="79" y="134" width="22" height="38" rx="11" fill="#000" opacity="0.35"/>
      <text x="90" y="270" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Black</text>
      <text x="90" y="290" text-anchor="middle" fill="#6b7280" font-size="12">#1C1C1E</text>
    </g>
    <!-- Fuchsia -->
    <g transform="translate(270,0)">
      <line x1="90" y1="-6" x2="90" y2="22" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="14" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="#d946ef"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="88" r="25" fill="#0a0a0a"/><circle cx="90" cy="88" r="16" fill="#1b1b1f"/><circle cx="83" cy="81" r="6" fill="#fff" opacity="0.4"/>
      <rect x="79" y="134" width="22" height="38" rx="11" fill="#000" opacity="0.22"/>
      <text x="90" y="270" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Fuchsia</text>
      <text x="90" y="290" text-anchor="middle" fill="#6b7280" font-size="12">#D946EF</text>
    </g>
    <!-- Orange -->
    <g transform="translate(470,0)">
      <line x1="90" y1="-6" x2="90" y2="22" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="14" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="#f97316"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="88" r="25" fill="#0a0a0a"/><circle cx="90" cy="88" r="16" fill="#1b1b1f"/><circle cx="83" cy="81" r="6" fill="#fff" opacity="0.4"/>
      <rect x="79" y="134" width="22" height="38" rx="11" fill="#000" opacity="0.22"/>
      <text x="90" y="270" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Orange</text>
      <text x="90" y="290" text-anchor="middle" fill="#6b7280" font-size="12">#F97316</text>
    </g>
    <!-- Yellow -->
    <g transform="translate(670,0)">
      <line x1="90" y1="-6" x2="90" y2="22" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="14" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="#facc15"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="88" r="25" fill="#0a0a0a"/><circle cx="90" cy="88" r="16" fill="#1b1b1f"/><circle cx="83" cy="81" r="6" fill="#fff" opacity="0.4"/>
      <rect x="79" y="134" width="22" height="38" rx="11" fill="#000" opacity="0.18"/>
      <text x="90" y="270" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Yellow</text>
      <text x="90" y="290" text-anchor="middle" fill="#6b7280" font-size="12">#FACC15</text>
    </g>
    <!-- Lime -->
    <g transform="translate(870,0)">
      <line x1="90" y1="-6" x2="90" y2="22" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="14" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="#84cc16"/>
      <path d="M40 58 Q90 22 140 58 Q166 116 140 200 Q90 238 40 200 Q14 116 40 58 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="88" r="25" fill="#0a0a0a"/><circle cx="90" cy="88" r="16" fill="#1b1b1f"/><circle cx="83" cy="81" r="6" fill="#fff" opacity="0.4"/>
      <rect x="79" y="134" width="22" height="38" rx="11" fill="#000" opacity="0.2"/>
      <text x="90" y="270" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Lime green</text>
      <text x="90" y="290" text-anchor="middle" fill="#6b7280" font-size="12">#84CC16</text>
    </g>
  </g>

  <!-- Furry cover callout, bottom strip -->
  <g transform="translate(0,430)">
    <rect x="40" y="0" width="1020" height="106" rx="14" fill="#ffffff" opacity="0.03"/>
    <!-- furry pendant: fuchsia fuzz -->
    <g transform="translate(110,53)">
      <g>
        <!-- fur spikes -->
        <g fill="#e070e8">
          <path d="M-52 0 L-40 -10 L-38 6 Z"/><path d="M-50 20 L-38 14 L-36 30 Z"/>
          <path d="M-44 40 L-32 34 L-28 50 Z"/><path d="M52 0 L40 -10 L38 6 Z"/>
          <path d="M50 20 L38 14 L36 30 Z"/><path d="M44 40 L32 34 L28 50 Z"/>
          <path d="M-30 -34 L-22 -22 L-38 -22 Z"/><path d="M30 -34 L22 -22 L38 -22 Z"/>
          <path d="M0 -44 L-8 -30 L8 -30 Z"/><path d="M-20 46 L-10 36 L-4 50 Z"/>
          <path d="M20 46 L10 36 L4 50 Z"/><path d="M0 50 L-8 38 L8 38 Z"/>
        </g>
        <ellipse cx="0" cy="4" rx="42" ry="46" fill="#d946ef"/>
        <ellipse cx="0" cy="4" rx="42" ry="46" fill="url(#sheen)"/>
        <circle cx="0" cy="-4" r="14" fill="#0a0a0a"/><circle cx="0" cy="-4" r="9" fill="#1b1b1f"/>
      </g>
    </g>
    <text x="185" y="40" fill="#d4a5e9" font-size="18" font-weight="700">Furry cover (optional, playful)</text>
    <text x="185" y="66" fill="#9ca3af" font-size="14">Slip-on plush skin with cut-outs for the lens, button and USB-C. On-brand fun,</text>
    <text x="185" y="88" fill="#9ca3af" font-size="14">and it makes the camera friendly and obvious - the opposite of a hidden spy cam.</text>
  </g>
</svg>
