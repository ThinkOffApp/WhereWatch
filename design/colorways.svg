      <circle cx="190" cy="22" r="11" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M140 66 Q190 30 240 66 Q266 124 240 206 Q190 244 140 206 Q114 124 140 66 Z" fill="#f97316"/>
      <path d="M140 66 Q190 30 240 66 Q266 124 240 206 Q190 244 140 206 Q114 124 140 66 Z" fill="url(#sheen)"/>
