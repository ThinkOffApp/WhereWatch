<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="440" fill="url(#bg)"/>
  <text x="40" y="52" fill="#d4a5e9" font-size="26" font-weight="700">WhereWatch pendant — colorways</text>
  <text x="40" y="80" fill="#9ca3af" font-size="15">Soft-touch finish. Five options: Black plus four ThinkOff colors.</text>

  <!-- 5 pendants -->
  <g id="row" transform="translate(0,110)">
    <!-- template via use: each group placed and tinted -->
    <!-- Black -->
    <g transform="translate(70,0)">
      <line x1="90" y1="-6" x2="90" y2="24" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="16" r="12" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="#1c1c1e"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="92" r="26" fill="#0a0a0a"/><circle cx="90" cy="92" r="17" fill="#1b1b1f"/><circle cx="83" cy="85" r="6" fill="#ffffff" opacity="0.4"/>
      <rect x="78" y="140" width="24" height="40" rx="12" fill="#000" opacity="0.35"/>
      <text x="90" y="290" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Black</text>
      <text x="90" y="310" text-anchor="middle" fill="#6b7280" font-size="12">#1C1C1E</text>
    </g>
    <!-- Fuchsia -->
    <g transform="translate(270,0)">
      <line x1="90" y1="-6" x2="90" y2="24" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="16" r="12" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="#d946ef"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="92" r="26" fill="#0a0a0a"/><circle cx="90" cy="92" r="17" fill="#1b1b1f"/><circle cx="83" cy="85" r="6" fill="#ffffff" opacity="0.4"/>
      <rect x="78" y="140" width="24" height="40" rx="12" fill="#000" opacity="0.22"/>
      <text x="90" y="290" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Fuchsia</text>
      <text x="90" y="310" text-anchor="middle" fill="#6b7280" font-size="12">#D946EF</text>
    </g>
    <!-- Orange -->
    <g transform="translate(470,0)">
      <line x1="90" y1="-6" x2="90" y2="24" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="16" r="12" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="#f97316"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="92" r="26" fill="#0a0a0a"/><circle cx="90" cy="92" r="17" fill="#1b1b1f"/><circle cx="83" cy="85" r="6" fill="#ffffff" opacity="0.4"/>
      <rect x="78" y="140" width="24" height="40" rx="12" fill="#000" opacity="0.22"/>
      <text x="90" y="290" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Orange</text>
      <text x="90" y="310" text-anchor="middle" fill="#6b7280" font-size="12">#F97316</text>
    </g>
    <!-- Yellow -->
    <g transform="translate(670,0)">
      <line x1="90" y1="-6" x2="90" y2="24" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="16" r="12" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="#facc15"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="92" r="26" fill="#0a0a0a"/><circle cx="90" cy="92" r="17" fill="#1b1b1f"/><circle cx="83" cy="85" r="6" fill="#ffffff" opacity="0.4"/>
      <rect x="78" y="140" width="24" height="40" rx="12" fill="#000" opacity="0.18"/>
      <text x="90" y="290" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Yellow</text>
      <text x="90" y="310" text-anchor="middle" fill="#6b7280" font-size="12">#FACC15</text>
    </g>
    <!-- Lime -->
    <g transform="translate(870,0)">
      <line x1="90" y1="-6" x2="90" y2="24" stroke="#555" stroke-width="4"/>
      <circle cx="90" cy="16" r="12" fill="none" stroke="#666" stroke-width="5"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="#84cc16"/>
      <path d="M40 60 Q90 24 140 60 Q168 120 140 210 Q90 250 40 210 Q12 120 40 60 Z" fill="url(#sheen)"/>
      <circle cx="90" cy="92" r="26" fill="#0a0a0a"/><circle cx="90" cy="92" r="17" fill="#1b1b1f"/><circle cx="83" cy="85" r="6" fill="#ffffff" opacity="0.4"/>
      <rect x="78" y="140" width="24" height="40" rx="12" fill="#000" opacity="0.2"/>
      <text x="90" y="290" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="600">Lime green</text>
      <text x="90" y="310" text-anchor="middle" fill="#6b7280" font-size="12">#84CC16</text>
    </g>
  </g>
</svg>
