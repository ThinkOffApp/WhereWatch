          <path d="M-38 36 L-28 30 L-24 44 Z"/><path d="M46 0 L35 -9 L33 5 Z"/>
          <path d="M44 18 L33 12 L31 26 Z"/><path d="M38 36 L28 30 L24 44 Z"/>
          <path d="M-26 -30 L-19 -19 L-33 -19 Z"/><path d="M26 -30 L19 -19 L33 -19 Z"/>
          <path d="M0 -38 L-7 -26 L7 -26 Z"/><path d="M0 44 L-7 33 L7 33 Z"/>
        </g>
        <ellipse cx="0" cy="3" rx="37" ry="40" fill="#d946ef"/>
        <ellipse cx="0" cy="3" rx="37" ry="40" fill="url(#sheen)"/>
        <circle cx="0" cy="-3" r="12" fill="#0a0a0a"/><circle cx="0" cy="-3" r="8" fill="#1b1b1f"/>
