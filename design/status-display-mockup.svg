<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 320 240" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/>
      <stop offset="0.5" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#d4a5e9"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a5d4e9"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" fill="url(#bg)"/>

  <!-- header -->
  <text x="16" y="30" fill="#d4a5e9" font-size="17" font-weight="700">💜 WhereWatch</text>
  <circle cx="284" cy="24" r="5" fill="#4ade80"/>
  <text x="276" y="28" text-anchor="end" fill="#9ca3af" font-size="11">online</text>

  <!-- pendant charge -->
  <text x="16" y="66" fill="#e0e0e0" font-size="13">Pendant</text>
  <text x="304" y="66" text-anchor="end" fill="#ffffff" font-size="13" font-weight="600">72% · streaming</text>
  <rect x="16" y="74" width="288" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <rect x="16" y="74" width="207" height="12" rx="6" fill="url(#charge)"/>

  <!-- storage -->
  <text x="16" y="112" fill="#e0e0e0" font-size="13">Storage</text>
  <text x="304" y="112" text-anchor="end" fill="#ffffff" font-size="13" font-weight="600">38% · ~5 months left</text>
  <rect x="16" y="120" width="288" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <rect x="16" y="120" width="109" height="12" rx="6" fill="url(#store)"/>

  <!-- divider -->
  <rect x="16" y="150" width="288" height="1" fill="#ffffff" opacity="0.08"/>

  <!-- last event -->
  <text x="16" y="176" fill="#9ca3af" font-size="12">Last seen</text>
  <text x="16" y="196" fill="#ffffff" font-size="14" font-weight="600">keys · hallway table</text>
  <text x="16" y="213" fill="#6b7280" font-size="11">2 min ago</text>

  <!-- today count chip -->
  <rect x="196" y="170" width="108" height="46" rx="10" fill="#d946ef" opacity="0.12"/>
  <text x="250" y="192" text-anchor="middle" fill="#d4a5e9" font-size="22" font-weight="700">14</text>
  <text x="250" y="208" text-anchor="middle" fill="#9ca3af" font-size="10">things today</text>
</svg>
